<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <!-- navbar -->
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a
          ><!-- change for the image -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./Backoffice.html"
                  >BackOffice</a
                >
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container">
        <div class="row">
          <div class="col-6 d-flex justify-content-center">
            <form id="productForm">
              <h2 id="formTitle" class="mb-3">Create product</h2>

              <div class="mb-3">
                <label for="nameProduct" class="form-label">Name Product</label>
                <input
                  type="text"
                  class="form-control"
                  id="nameProduct"
                  required
                />

                <label for="descriptionProduct" class="form-label"
                  >About the Product</label
                >
                <input
                  type="text"
                  maxlength="300"
                  class="form-control"
                  id="descriptionProduct"
                  required
                />

                <label for="urlImgProduct" class="form-label"
                  >Product Image</label
                >
                <input
                  type="url"
                  class="form-control"
                  id="urlImgProduct"
                  required
                />

                <label for="categoryProduct" class="form-label"
                  >Food Category</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="categoryProduct"
                  placeholder="category"
                  required
                />

                <label for="priceProduct" class="form-label"
                  >Price product</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="priceProduct"
                  required
                />
              </div>

              <div class="d-flex gap-2">
                <button type="submit" id="submitBtn" class="btn btn-primary">
                  Create product
                </button>
                <button type="button" id="resetBtn" class="btn btn-secondary">
                  Reset
                </button>
                <button
                  type="button"
                  id="deleteBtn"
                  class="btn btn-danger d-none"
                >
                  Delete
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/backoffice.js"></script>
  </body>
</html>
